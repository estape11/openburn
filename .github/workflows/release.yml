# Runs ONLY when a v* tag is pushed (plus manual re-run via workflow_dispatch,
# e.g. if a job died — re-running by input tag is traceable, re-tagging is not).
# Publishes a GitHub Release with the notes taken from the CHANGELOG section.
#
# No package/image publishing yet — deliberately deferred until there is
# something an end user would install (see ROADMAP "Not in the plan").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  # The VERSION file at the root is the single source of truth. A tag that
  # doesn't match it is a mistake — abort before publishing anything.
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          # workflow_dispatch input goes through env, never interpolated into
          # the script: inputs are user-controlled text.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag '$TAG' must start with 'v'."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.resolve.outputs.tag }}
      - name: VERSION file must match the tag
        env:
          VERSION_EXPECTED: ${{ steps.resolve.outputs.version }}
        run: |
          VERSION_FILE=$(tr -d '[:space:]' < VERSION)
          if [ "$VERSION_FILE" != "$VERSION_EXPECTED" ]; then
            echo "::error::VERSION file says '$VERSION_FILE' but the tag says '$VERSION_EXPECTED'. Run scripts/bump-version.sh before tagging."
            exit 1
          fi

  create-release:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-version.outputs.tag }}
      - name: Extract CHANGELOG section
        id: notes
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          # Section format (written by scripts/changelog.js):
          #   ## [X.Y.Z] - YYYY-MM-DD — Title of the release
          # The title is NOT decorative: it names the GitHub Release.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md. Run scripts/changelog.js release before tagging."
            exit 1
          fi
          HEADER=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md || true)
          TITLE=$(echo "$HEADER" | sed -n 's/.* — //p')
          if [ -z "$TITLE" ]; then
            echo "::warning::The CHANGELOG section has no title after ' — '; the release will be named 'v$VERSION' only."
            NAME="v$VERSION"
          else
            NAME="v$VERSION — $TITLE"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: /tmp/notes.md
          make_latest: true
